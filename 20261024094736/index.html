<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>应龙计算 · 算力无限</title>
<style>
  :root{
    --green: #219912;        /* logo 主绿 */
    --green-glow: #4ef03a;   /* 高光绿 */
    --text: #eaf2ff;
    --muted: #7f93ad;

    /* 第二阶段（停靠状态）的排版参数，改这里就能整体调大小 */
    --pad-x: clamp(20px, 5vw, 34px);   /* 左边距 */
    --pad-y: clamp(18px, 4vh, 28px);   /* 上边距 */
    --logo-w: 56px;                    /* 停靠后 logo 宽度 */
    --gap: 14px;                       /* logo 与标题的间距 */
    --skew: -7deg;                     /* 标题斜切角度，想要更锋利可加大，设为 0 则正体 */
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    background:
      radial-gradient(900px 620px at 50% 40%, #0e1a29 0%, #070b12 55%, #03050a 100%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "HarmonyOS Sans SC", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景网格 + 顶部微光，纯装饰 */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(120,180,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,180,255,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(58% 52% at 50% 44%, #000 0%, transparent 100%);
            mask-image: radial-gradient(58% 52% at 50% 44%, #000 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
    transition: opacity 1.1s ease;
  }

  /* 白色页面层：第二阶段淡入，把深色背景切成白色 */
  body::after{
    content: "";
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: opacity 1.4s ease;
  }
  /* 配色切换单独用一个类，保证颜色是“渐变”过去的 */
  body.light::before{ opacity: 0; }
  body.light::after{ opacity: 1; }

  /* ---------- 舞台：整体偏上方 ---------- */
  .stage{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateY(-8vh);   /* 让内容落在页面偏上方 */
    text-align: center;
  }
  body.docked .stage{ transform: none; }   /* 解除偏移，让内部元素可以贴到视口四角 */

  /* ---------- 标题：应龙计算 ---------- */
  .title{
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(34px, 8.5vw, 66px);
    font-weight: 600;
    letter-spacing: .22em;
    padding-left: .22em;           /* 抵消最后一个字后面的字距，保证真正居中 */
    line-height: 1.25;
    text-shadow: 0 0 28px rgba(120,190,255,.28);
    transition: color 1.2s ease, text-shadow 1.2s ease;
  }

  /* 停靠后：黑色、更小、更锋利（字重拉满 + 收紧字距 + 轻微斜切），移到 logo 右侧 */
  body.docked .title{
    position: fixed;
    display: block;
    top: calc(var(--pad-y) + 18.5px - .625em);   /* 与 logo 垂直居中对齐 */
    left: calc(var(--pad-x) + var(--logo-w) + var(--gap));
    font-family: "Source Han Sans CN", "Source Han Sans SC", "Noto Sans SC", "HarmonyOS Sans SC",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(18px, 4.4vw, 25px);
    font-weight: 900;
    letter-spacing: .04em;
    padding-left: .04em;
  }
  body.light .title{
    color: #0a0e13;
    text-shadow: none;
  }
  body.docked #titleText{
    display: inline-block;
    transform: skewX(var(--skew));
  }

  .caret{
    display: inline-block;
    width: 3px;
    height: .92em;
    margin-left: .18em;
    background: var(--green-glow);
    box-shadow: 0 0 12px var(--green-glow);
    opacity: 0;
    transition: opacity .25s ease;
  }
  .caret.on{ opacity: 1; }
  .caret.blink{ animation: blink 1s steps(1, end) infinite; }
  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* ---------- 副标题：算力无限 ---------- */
  .subtitle{
    margin-top: 14px;
    font-size: clamp(12px, 2.6vw, 17px);
    font-weight: 400;
    letter-spacing: .62em;
    padding-left: .62em;
    color: var(--muted);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .subtitle.show{ opacity: 1; transform: translateY(0); }

  /* 停靠后：缩到最小，固定在页面最下方居中 */
  body.docked .subtitle{
    position: fixed;
    bottom: clamp(18px, 4vh, 28px);
    left: 0;
    right: 0;
    width: max-content;      /* 让元素宽度等于文字宽度，居中才准 */
    margin: 0 auto;
    font-size: 12px;
    letter-spacing: .52em;
    padding-left: .52em;
  }
  body.light .subtitle{ color: #9aa3ad; }

  /* ---------- Logo ---------- */
  .logo-wrap{
    margin-top: clamp(34px, 7vh, 64px);
    opacity: 0;
    transition: opacity .4s ease;
  }
  .logo-wrap.show{ opacity: 1; }

  .logo{
    width: clamp(170px, 42vw, 280px);
    height: auto;
    display: block;
    overflow: visible;
  }

  /* 白色折线：先描边（透明填充），描完之后再填充成白色 */
  .w-path{
    fill: #ffffff;
    fill-opacity: 0;
    stroke: #ffffff;
    stroke-width: .55;
    stroke-linejoin: round;
    stroke-linecap: round;
    filter: drop-shadow(0 0 1.2px rgba(255,255,255,.55));
  }

  .scan{ opacity: 0; }

  /* 全部画完后的收尾效果：轻微上浮 + 绿色光晕 */
  .logo{ transform: translateY(6px) scale(.985); transition: transform 1s cubic-bezier(.2,.8,.2,1); }
  .logo.done{
    transform: translateY(0) scale(1);
    filter: drop-shadow(0 0 18px rgba(33,153,18,.45));
  }

  /* 停靠后：缩小并固定在左上角（logo 自带绿色底，白底页面上依然清晰） */
  body.docked .logo-wrap{
    position: fixed;
    top: var(--pad-y);
    left: var(--pad-x);
    margin-top: 0;
  }
  body.docked .logo{
    width: var(--logo-w);
    transition: filter 1.2s ease;
  }
  body.light .logo.done{ filter: drop-shadow(0 2px 6px rgba(33,153,18,.28)); }

  /* ---------- 变阵结束后才出现的右上角导航 ---------- */
  .topnav{
    position: fixed;
    z-index: 3;
    top: clamp(18px, 4vh, 28px);
    right: var(--pad-x);
    display: flex;
    gap: clamp(14px, 3vw, 26px);
    opacity: 0;
    transition: opacity .8s ease;
  }
  .topnav.show{ opacity: 1; }
  .topnav a{
    font-size: 14px;
    color: #5b6674;
    text-decoration: none;
    padding-bottom: 2px;
    border-bottom: 2px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  .topnav a:hover{
    color: #0a0e13;
    border-bottom-color: var(--green);
  }

  .hint{
    position: fixed;
    z-index: 3;
    bottom: 22px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    letter-spacing: .18em;
    color: #3d4c5f;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .hint.show{ opacity: 1; }

  @media (max-height: 560px){
    .stage{ transform: translateY(-4vh); }
  }
</style>
</head>
<body>

  <div class="stage">
    <h1 class="title"><span id="titleText"></span><i class="caret" id="caret"></i></h1>
    <p class="subtitle" id="subtitle">算力无限</p>

    <div class="logo-wrap" id="logoWrap">
      <!--
        logo 原始图形位于 x:[16.76, 78.71]  y:[53.57, 92.93]
        这里把 viewBox 收紧到图形外框，方便排版与缩放
      -->
      <svg class="logo" id="logo" viewBox="14.7 51.5 66 43.5" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 绿色区域的“从左往右展开”遮罩 -->
          <clipPath id="greenClip">
            <rect id="greenClipRect" x="16.763189" y="53.569324" width="0" height="39.357052" />
          </clipPath>
          <!-- 白色折线的“从左往右绘制”遮罩 -->
          <clipPath id="whiteClip">
            <rect id="whiteClipRect" x="14.7" y="51" width="0" height="45" />
          </clipPath>
        </defs>

        <!-- 绿色区域（在白色折线下方，最后绘制） -->
        <g clip-path="url(#greenClip)">
          <rect x="16.763189" y="53.569324" width="61.95092" height="39.357052" fill="#219912" />
        </g>

        <!-- 白色折线（在最上方，先绘制） -->
        <g clip-path="url(#whiteClip)">
          <path class="w-path" id="pathZ"
            d="M 16.763834,78.398313 V 68.2656 l 20.277833,-0.0031 7.579899,-14.692643 10.397298,-10e-4 5.438427,14.693677 18.255217,0.0031 0.001,10.133748 -25.929167,-0.214974 -3.175,-17.727084 -6.35,17.859375 z" />
          <path class="w-path" id="pathFlag"
            d="m 30.261718,68.229426 -3.706233,-14.65957 h 7.640876 l 2.845305,14.693678 5.307608,24.663992 -9.057248,-7.94e-4 z" />
        </g>

        <!-- 绘制绿色区域时跟随的扫描高光 -->
        <rect class="scan" id="scan" x="16.763189" y="51.5" width="1.4" height="43.5" fill="#c8ffb8" />
      </svg>
    </div>
  </div>

  <nav class="topnav" id="topnav">
    <a href="posts.html">投稿列表</a>
    <a href="submit.html">我要投稿</a>
  </nav>

  <div class="hint" id="hint">点击任意位置可跳过动画</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const titleText  = $('titleText');
  const caret      = $('caret');
  const subtitle   = $('subtitle');
  const logoWrap   = $('logoWrap');
  const logo       = $('logo');
  const scan       = $('scan');
  const greenRect  = $('greenClipRect');
  const whiteRect  = $('whiteClipRect');
  const paths      = [$('pathZ'), $('pathFlag')];
  const title      = document.querySelector('.title');   // h1
  const hint       = $('hint');
  const topnav     = $('topnav');

  /* ============ 小工具 ============ */
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let skipped = reduceMotion;                       // 跳过动画（无障碍 / 手动跳过）
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
  const easeOut   = t => 1 - Math.pow(1 - t, 3);

  // 基于 rAF 的补间，支持中途“跳过”
  function tween({ duration = 600, delay = 0, easing = easeInOut, onUpdate, onDone }) {
    return new Promise(resolve => {
      const begin = performance.now() + delay * 1000;   // delay 单位：秒
      function frame(now) {
        let t = (now - begin) / duration;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        if (skipped) t = 1;
        onUpdate(easing(t), t);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          onDone && onDone();
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // 点击 / 任意按键跳过
  function skip() { skipped = true; }
  window.addEventListener('pointerdown', skip);
  window.addEventListener('keydown', skip);

  /* ============ 1. 标题逐字打出 ============ */
  async function typeTitle(text, perChar = 320) {
    caret.classList.add('on');
    for (const ch of text) {
      titleText.textContent += ch;
      await sleep(skipped ? 0 : perChar);
    }
    caret.classList.add('blink');
  }

  /* ============ 2. Logo 绘制 ============ */
  function preparePaths() {
    paths.forEach(p => {
      const len = p.getTotalLength();
      p.dataset.len = len;
      p.style.strokeDasharray  = len;
      p.style.strokeDashoffset = len;   // 描边全部隐藏，等着一点点画出来
      p.style.fillOpacity      = 0;
    });
  }

  // 终态：直接把 logo 显示成画完的样子
  function setFinalState() {
    whiteRect.setAttribute('width', 66);
    greenRect.setAttribute('width', 61.95092);
    scan.setAttribute('opacity', 0);
    paths.forEach(p => {
      p.style.strokeDashoffset = 0;
      p.style.fillOpacity = 1;
    });
    logo.classList.add('done');
    caret.classList.remove('blink', 'on');
  }

  async function drawLogo() {
    logoWrap.classList.add('show');
    preparePaths();
    if (reduceMotion) { setFinalState(); return; }

    // 2-1 白色折线：描边动画 + 遮罩从左往右推进
    whiteRect.setAttribute('width', 0);
    const strokeTasks = paths.map((p, i) => {
      const len = +p.dataset.len;
      return tween({
        duration: i === 0 ? 1150 : 850,
        delay: i * 480 / 1000,
        easing: easeInOut,
        onUpdate: e => { p.style.strokeDashoffset = len * (1 - e); }
      });
    });
    tween({
      duration: 1650,
      easing: easeInOut,
      onUpdate: e => whiteRect.setAttribute('width', 66 * e)
    });

    await Promise.all(strokeTasks);

    // 2-2 白色折线填充（描边 → 实心）
    await Promise.all(paths.map((p, i) => tween({
      duration: 520,
      delay: i * 90 / 1000,
      easing: easeOut,
      onUpdate: e => { p.style.fillOpacity = e; }
    })));

    if (skipped) { setFinalState(); return; }

    // 2-3 绿色区域从左往右“画”出来，带一条扫描高光
    scan.setAttribute('opacity', .9);
    await tween({
      duration: 1150,
      easing: easeInOut,
      onUpdate: e => {
        const w = 61.95092 * e;
        greenRect.setAttribute('width', w);
        scan.setAttribute('x', 16.763189 + w);
        scan.setAttribute('opacity', e < .92 ? .9 : .9 * (1 - (e - .92) / .08));
      },
      onDone: () => scan.setAttribute('opacity', 0)
    });

    // 2-4 收尾：轻微上浮 + 绿色光晕
    logo.classList.add('done');
    caret.classList.remove('blink', 'on');
  }

  /* ============ 3. 等一个输入（或自动）开始变阵 ============ */
  function waitForAdvance() {
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearTimeout(autoTimer);
        window.removeEventListener('keydown', finish);
        window.removeEventListener('pointerdown', finish);
        hint.classList.remove('show');
        resolve();
      };

      const autoTimer = setTimeout(finish, 3200);   // 没按键就自动继续
      hint.textContent = '按任意键继续';
      hint.classList.add('show');

      // 稍等一下再绑定，避免入场时的那一次点击顺带把这里也触发了
      setTimeout(() => {
        if (done) return;
        window.addEventListener('keydown', finish);
        window.addEventListener('pointerdown', finish);
      }, 300);
    });
  }

  /* ============ 4. 变阵：FLIP（先记录旧位置 → 切布局 → 从旧位置平滑飞到新位置）============ */
  const DOCK_DURATION = 2000;   // 变阵总时长，约 2 秒

  async function dockLayout() {
    const els = [logoWrap, title, subtitle];

    if (reduceMotion) {                 // 无障碍：直接落到终态
      document.body.classList.add('docked', 'light');
      return;
    }

    const first = els.map(el => el.getBoundingClientRect());   // 旧位置

    // 先关掉过渡，让下面的布局 / 字号 / 字体切换瞬间完成（位置由 invert 的 transform 顶住）
    els.forEach(el => { el.style.transition = 'none'; });

    document.body.classList.add('docked');                     // 切成停靠布局

    const last = els.map(el => el.getBoundingClientRect());    // 新位置

    els.forEach((el, i) => {
      const f = first[i], l = last[i];
      if (!f.width || !l.width) return;
      const scale = f.width / l.width;                         // 用宽度比做统一缩放，字号变化也被吃掉
      el.style.transformOrigin = '0 0';
      el.style.transform = `translate(${f.left - l.left}px, ${f.top - l.top}px) scale(${scale})`;
    });

    // 等起始状态真正渲染一帧，再放开过渡
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    document.body.classList.add('light');       // 白底 + 黑色文字，从这里开始渐变
    els.forEach(el => {
      el.style.transition = `transform ${DOCK_DURATION}ms cubic-bezier(.62,.02,.22,1), color 1.2s ease, text-shadow 1.2s ease`;
      el.style.transform  = 'translate(0px, 0px) scale(1)';
    });

    await sleep(DOCK_DURATION + 80);

    // 收尾：清掉内联样式，让 CSS 接管（文字回到原生渲染，最清晰）
    els.forEach(el => {
      el.style.transition = '';
      el.style.transform = '';
      el.style.transformOrigin = '';
    });
  }

  /* ============ 主时间线 ============ */
  async function run() {
    hint.textContent = '点击任意位置可跳过动画';
    hint.classList.add('show');

    await sleep(skipped ? 0 : 500);
    await typeTitle('应龙计算');                 // 一字一字打出
    await sleep(skipped ? 0 : 380);
    subtitle.classList.add('show');              // 小字号副标题淡入
    await sleep(skipped ? 0 : 900);
    await drawLogo();                            // 白色折线 → 绿色区域

    hint.classList.remove('show');
    await sleep(skipped ? 0 : 450);
    await waitForAdvance();                      // 按键或自动进入下一阶段
    await dockLayout();                          // logo 缩到左上、标题变黑居左、口号落到底部
    topnav.classList.add('show');                // 导航最后淡入
  }

  run();
})();
</script>
</body>
</html>
